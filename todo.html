<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办清单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    width: 420px;
    max-width: 92vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { font-size: 24px; color: #333; margin-bottom: 20px; text-align: center; }
  .input-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .input-row input {
    flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0;
    border-radius: 8px; font-size: 15px; outline: none;
    transition: border-color .2s;
  }
  .input-row input:focus { border-color: #667eea; }
  .input-row button {
    padding: 12px 20px; border: none; border-radius: 8px;
    background: #667eea; color: #fff; font-size: 15px; cursor: pointer;
    transition: background .2s;
  }
  .input-row button:hover { background: #5568d8; }
  ul { list-style: none; }
  li {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; background: #f7f7f9; border-radius: 8px;
    margin-bottom: 8px; font-size: 15px; color: #333;
    animation: slideIn .25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  li.done span { text-decoration: line-through; color: #aaa; }
  li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  li span { flex: 1; word-break: break-all; }
  li .del {
    border: none; background: none; color: #e74c3c; font-size: 18px;
    cursor: pointer; line-height: 1; padding: 0 4px; opacity: .6;
    transition: opacity .2s;
  }
  li .del:hover { opacity: 1; }
  .stats { text-align: center; color: #999; font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>
  <div class="container">
    <h1>📝 待办清单</h1>
    <div class="input-row">
      <input id="taskInput" type="text" placeholder="输入新待办事项，按回车添加">
      <button onclick="addTask()">添加</button>
    </div>
    <ul id="taskList"></ul>
    <div class="stats" id="stats"></div>
  </div>
<script>
  // 从本地存储读取
  let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');

  function save() { localStorage.setItem('tasks', JSON.stringify(tasks)); }

  function render() {
    const list = document.getElementById('taskList');
    list.innerHTML = '';
    tasks.forEach((t, i) => {
      const li = document.createElement('li');
      if (t.done) li.classList.add('done');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; save(); render(); };
      const span = document.createElement('span');
      span.textContent = t.text;
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '✕';
      del.onclick = () => { tasks.splice(i, 1); save(); render(); };
      li.appendChild(cb); li.appendChild(span); li.appendChild(del);
      list.appendChild(li);
    });
    const done = tasks.filter(t => t.done).length;
    document.getElementById('stats').textContent =
      `共 ${tasks.length} 项 · 已完成 ${done} 项`;
  }

  function addTask() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ text, done: false });
    save(); render(); input.value = '';
    input.focus();
  }

  document.getElementById('taskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  render();
</script>
</body>
</html>
