<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<title>猜数字 · 插红旗</title>
<style>
:root{--bg:#FAF7F2;--blue:#8CA8B8;--coral:#D97A6C;--ink:#4A4A4A;--muted:#A8A8A8;--white:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:22px 16px 32px}.app{width:100%;max-width:430px}.top{text-align:center;margin:4px 0 18px}.top h1{margin:0;font-size:25px;font-weight:750;letter-spacing:1px}.top p{margin:7px 0;color:var(--muted);font-size:13px}.card{background:var(--white);border-radius:24px;padding:22px 20px;box-shadow:0 10px 34px rgba(74,74,74,.08);margin-bottom:14px}.roundline{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:650}.roundline .label{color:var(--blue)}.flags{display:flex;justify-content:center;gap:8px;margin:18px 0 20px}.flag{width:44px;height:45px;border-radius:14px;background:#F2F1EF;display:grid;place-items:center;font-size:23px;filter:grayscale(1);opacity:.55;transition:.35s}.flag.on{background:#FFF0ED;filter:none;opacity:1;transform:translateY(-2px);box-shadow:0 5px 12px #d97a6c22}.timerrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:13px;color:var(--muted)}.time{font-size:22px;font-variant-numeric:tabular-nums;font-weight:750;color:var(--ink)}.time.urgent{color:var(--coral)}.track{height:8px;background:#F0EFEC;border-radius:99px;overflow:hidden}.bar{height:100%;width:100%;background:var(--blue);border-radius:99px;transition:width .25s linear,background .3s}.bar.urgent{background:var(--coral)}.prompt{text-align:center;min-height:60px;padding:22px 4px 14px;font-size:17px;font-weight:650}.prompt small{display:block;margin-top:7px;font-size:13px;font-weight:400;color:var(--muted)}.guess{display:flex;gap:10px}.guess input{min-width:0;flex:1;height:52px;border:1.5px solid #E8E5E0;border-radius:15px;padding:0 15px;font-size:18px;color:var(--ink);outline:none;background:#FFFEFD}.guess input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #8ca8b820}.btn{border:0;border-radius:15px;padding:0 20px;background:var(--blue);color:white;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s,opacity .15s}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}.hint{text-align:center;min-height:24px;margin-top:12px;color:var(--coral);font-size:14px}.range{text-align:center;color:var(--muted);font-size:12px;margin-top:4px}.overlay{position:fixed;inset:0;background:#3d3b3990;display:grid;place-items:center;padding:20px;z-index:5}.dialog{width:min(100%,370px);background:white;border-radius:24px;padding:28px 23px;text-align:center;box-shadow:0 20px 60px #0002;animation:pop .3s ease}.dialog .big{font-size:42px}.dialog h2{font-size:22px;margin:8px 0}.dialog p{color:var(--muted);line-height:1.7;margin:8px 0 21px}.dialog .btn{height:48px;width:100%}.dialog #retry{margin-bottom:10px;background:#F1EFEC;color:#7A736C}.hidden{display:none!important}.result{text-align:center}.result .total{font-size:48px;color:var(--coral);font-weight:800;margin:12px 0 4px}.result .rating{font-size:18px;font-weight:700;color:var(--blue)}.times{margin:19px 0 22px;text-align:left;background:#FAF7F2;border-radius:16px;padding:13px 16px}.times div{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}.times span:last-child{color:var(--muted)}.result .btn{height:50px;width:100%}.canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}.footer{text-align:center;color:#B9B4AD;font-size:12px;padding:2px 0 6px}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}@media(max-width:360px){.card{padding:19px 16px}.flag{width:40px;height:41px}}
</style>
</head>
<body>
<canvas class="canvas" id="canvas"></canvas>
<main class="app">
  <header class="top"><h1>猜数字 · 插红旗</h1><p>猜中数字，把这一面红旗插进心愿里</p></header>
  <section class="card" id="game">
    <div class="roundline"><span class="label" id="round">第 1/5 局</span><span id="scoreLabel">红旗收集</span></div>
    <div class="flags" id="flags" aria-label="红旗收集位"></div>
    <div class="timerrow"><span>本局倒计时</span><span class="time" id="time">00:30</span></div>
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="prompt" id="prompt">1 到 100，试试你的直觉吧</div>
    <form class="guess" id="form"><input id="number" type="number" inputmode="numeric" enterkeyhint="go" min="1" max="100" placeholder="输入 1–100" autocomplete="off" aria-label="猜一个1到100的数字"><button class="btn" id="submit" type="submit">提交</button></form>
    <div class="hint" id="hint" aria-live="polite"></div><div class="range">每局 30 秒 · 一共 5 局</div>
  </section>
  <section class="card result hidden" id="result"></section>
  <div class="footer">慢慢来，好运正在靠近 ✨</div>
</main>
<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true"><div class="dialog"><div class="big" id="dialogIcon">⏳</div><h2 id="dialogTitle">时间到</h2><p id="dialogText"></p><button class="btn hidden" id="retry">再玩这一局</button><button class="btn" id="next">进入下一局</button></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),totalRounds=5,kindWords=['慢慢来，你已经很棒了','再感受一下数字的方向','好运正在悄悄靠近','相信你的第一直觉','离答案又近了一步','不急，答案就在前方'];
let round=1,flags=0,target=0,remaining=30,timer=null,locked=false,roundStart=0,roundTimes=[],roundWon=[],audioCtx=null,autoTimer=null,resultTimer=0;
const flagBox=$('flags');for(let i=0;i<5;i++){const e=document.createElement('div');e.className='flag';e.textContent='🚩';e.setAttribute('aria-label','未获得红旗');flagBox.appendChild(e)}
function setPrompt(text,sub=''){ $('prompt').innerHTML=text+(sub?'<small>'+sub+'</small>':'') }
function startRound(){clearInterval(timer);clearTimeout(resultTimer);locked=false;remaining=30;target=1+Math.floor(Math.random()*100);roundStart=Date.now();$('round').textContent=`第 ${round}/5 局`;$('time').textContent='00:30';$('time').classList.remove('urgent');$('bar').style.width='100%';$('bar').classList.remove('urgent');$('hint').textContent='';$('number').value='';$('number').disabled=false;$('submit').disabled=false;setPrompt('1 到 100，试试你的直觉吧');canvas.style.zIndex=4;$('overlay').style.background='';$('overlay').classList.add('hidden');$('game').classList.remove('hidden');$('result').classList.add('hidden');$('number').focus({preventScroll:true});timer=setInterval(tick,1000)}
function tick(){remaining--;const sec=Math.max(0,remaining);$('time').textContent=`00:${String(sec).padStart(2,'0')}`;$('bar').style.width=(sec/30*100)+'%';if(sec<=8){$('time').classList.add('urgent');$('bar').classList.add('urgent')}if(sec<=0){clearInterval(timer);roundTimes.push(30);roundWon.push(false);locked=true;$('number').disabled=true;$('submit').disabled=true;showDialog(false)}}
function showDialog(won){$('dialogIcon').textContent=won?'🚩':'⏳';$('dialogTitle').textContent=won?'红旗插上啦！':'时间到';$('dialogText').textContent=won?`太棒了！你猜中了 ${target}，只用了 ${roundTimes[roundTimes.length-1]} 秒，这一面红旗属于你 🚩`:'时间到，这面旗没插上。要再试一次这一局吗？';$('retry').classList.toggle('hidden',won);$('next').textContent=won?(round===totalRounds?'查看结算（3 秒后自动）':'进入下一局（3 秒后自动）'):(round===totalRounds?'放弃这面旗，看结算':'进入下一局（放弃这面旗）');$('overlay').style.background=won?'rgba(61,59,57,.22)':'';$('overlay').classList.remove('hidden');clearTimeout(autoTimer);if(won){autoTimer=setTimeout(()=>{if(!$('overlay').classList.contains('hidden'))advance()},3000)}}
function submitGuess(value){if(locked)return;const n=Number(value);if(!Number.isInteger(n)||n<1||n>100){$('hint').textContent='请输入 1 到 100 的整数';return}const delta=Math.abs(n-target);if(delta===0){clearInterval(timer);locked=true;flags++;roundTimes.push(Math.min(30,Math.round((Date.now()-roundStart)/1000)));roundWon.push(true);$('number').disabled=true;$('submit').disabled=true;updateFlags();setPrompt('🚩 第 '+flags+' 面红旗！','你让一面红旗迎风飘扬');celebrate(flags);canvas.style.zIndex=flags<5?6:4;playTune(flags);showDialog(true);return}const higher=n>target;$('hint').textContent=(higher?'太大了':'太小了')+' · '+kindWords[Math.floor(Math.random()*kindWords.length)];setPrompt(delta<=10?'很接近了':'继续试试看',delta<=10?'答案就在附近哦':'每一次尝试都在缩小范围');$('number').value='';$('number').focus({preventScroll:true})}
function updateFlags(){[...flagBox.children].forEach((e,i)=>{e.classList.toggle('on',i<flags);e.setAttribute('aria-label',i<flags?'已获得红旗':'未获得红旗')})}
$('form').addEventListener('submit',e=>{e.preventDefault();submitGuess($('number').value)});$('number').addEventListener('keydown',e=>{if(e.key==='Enter'||e.keyCode===13){e.preventDefault();submitGuess(e.target.value)}});function advance(){if(round===totalRounds){showResults();return}round++;startRound()}$('next').addEventListener('click',()=>{clearTimeout(autoTimer);advance()});$('retry').addEventListener('click',()=>{clearTimeout(autoTimer);roundTimes.pop();roundWon.pop();$('overlay').classList.add('hidden');startRound()});
function showResults(){clearInterval(timer);clearTimeout(autoTimer);canvas.style.zIndex=4;$('overlay').style.background='';$('overlay').classList.add('hidden');$('game').classList.add('hidden');const rating=flags===5?'🏆 红旗大满贯':flags===4?'🎖 优秀':flags===3?'🌱 还不错':'🌿 继续加油';const rows=Array.from({length:5},(_,i)=>`<div><span>第 ${i+1} 局</span><span>${roundTimes[i]===undefined?'未完成':roundTimes[i]+' 秒'}${roundWon[i]?' · 🚩':''}</span></div>`).join('');const totalSec=roundTimes.reduce((a,b)=>a+(b||0),0);$('result').innerHTML=`<div style="font-size:36px">${flags===5?'🏆':'🌷'}</div><div class="rating">${rating}</div><div class="total">${flags} <span style="font-size:20px;color:#A8A8A8">/ 5 面红旗</span></div><div style="margin:16px 0 -4px;font-size:14px;font-weight:700;color:#8CA8B8">本轮总用时 ${totalSec} 秒 · 平均 ${Math.round(totalSec/roundTimes.length)} 秒/局</div><div class="times">${rows}</div><button class="btn" id="again">再来一局</button>`;$('result').classList.remove('hidden');$('again').addEventListener('click',()=>{round=1;flags=0;roundTimes=[];roundWon=[];updateFlags();startRound()});clearTimeout(resultTimer);celebrate(flags);playTune(flags);resultTimer=setTimeout(()=>{celebrate(flags);playTune(flags)},2300)}
// Canvas fireworks: particle palette grows with every flag.
const canvas=$('canvas'),ctx=canvas.getContext('2d');let particles=[],raf=0;function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function palette(level){if(level<=0)return ['#B7C4B1','#CBD6C6','#E0E7DD'];if(level===1)return ['#EF8FA6','#F2A0B4','#F7BCCB'];if(level===2)return ['#E8B93F','#EFC95E','#F7DB8C'];if(level===3)return ['#9C7BD6','#7FB0E6','#D79BC8'];if(level===4)return ['#F08585','#E8B93F','#7FC79A','#7FB0E6','#9C7BD6'];return ['#FFD244','#FFF0A8','#FF9257','#F06FA5','#4FC8E8','#A87DFF','#FFFFFF']}
function burst(x,y,colors,power=1){for(let i=0;i<85*power;i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*5)*power;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:90+Math.random()*70,max:160,r:2.5+Math.random()*4,color:colors[Math.floor(Math.random()*colors.length)]})}if(!raf)raf=requestAnimationFrame(animate)}
function celebrate(level){const colors=palette(level),power=level===5?2:1;if(level===5){for(let k=0;k<6;k++)setTimeout(()=>burst(innerWidth*(.1+Math.random()*.8),innerHeight*(.08+Math.random()*.45),colors,1.5),k*220)}else{const spots=[[.5,.4],[.28,.5],[.72,.5],[.5,.63],[.34,.31],[.66,.31]];spots.forEach((s,k)=>setTimeout(()=>burst(innerWidth*s[0],innerHeight*s[1],colors,power),k*290))}}
function animate(){ctx.clearRect(0,0,innerWidth,innerHeight);if(particles.length){ctx.fillStyle='rgba(52,48,45,.22)';ctx.fillRect(0,0,innerWidth,innerHeight)}particles=particles.filter(p=>p.life-->0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.99;p.vy*=.99;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.shadowBlur=8;ctx.shadowColor=p.color;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;ctx.globalAlpha=1;if(particles.length)raf=requestAnimationFrame(animate);else{cancelAnimationFrame(raf);raf=0;ctx.clearRect(0,0,innerWidth,innerHeight)}}
// Short melodies are synthesized on demand; audio begins only after the player's gesture.
function playTune(level){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime,melodies={1:[659,784,988],2:[523,659,784,1047],3:[523,659,784,988,1175],4:[523,659,784,988,1175,1319,1568],5:[523,659,784,1047,1319,1568,1760,2093,1760,2093]};const base=melodies[level]||melodies[1];const notes=base.concat(base);notes.forEach((freq,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),at=now+i*(level===5?.15:.26);osc.type=level===5?'triangle':'sine';osc.frequency.setValueAtTime(freq,at);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(level===5?.16:.12,at+.025);gain.gain.exponentialRampToValueAtTime(.0001,at+.3);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(at);osc.stop(at+.32)});if(level>=3){for(let i=0;i<Math.min(level,5);i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain(),at=now+i*.18;o.type='sine';o.frequency.value=[262,330,392,523,659][i];g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(level===5?.05:.028,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+.24);o.connect(g);g.connect(audioCtx.destination);o.start(at);o.stop(at+.25)}}}catch(_){}}
startRound();
})();
</script>
</body>
</html>
